<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>medialab setup</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
  <style>
    :root { --bg: #0f1115; --panel: #171a21; --text: #e6e6e6; --muted: #9aa3b2; --ok: #3fb950; --warn: #d29922; --fail: #f85149; --accent: #58a6ff; --border: #2a2f3a; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: baseline; }
    header h1 { font-size: 18px; margin: 0; }
    nav { color: var(--muted); font-size: 14px; }
    nav span.current { color: var(--text); font-weight: 600; }
    main { max-width: 880px; margin: 0 auto; padding: 24px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .ok { color: var(--ok); } .warn { color: var(--warn); } .fail, .rejected { color: var(--fail); }
    .accepted { color: var(--ok); } .unverified { color: var(--warn); } .muted { color: var(--muted); }
    .field { display: grid; grid-template-columns: 220px 1fr auto; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .field label { font-weight: 600; padding-top: 6px; }
    .field label .req { color: var(--fail); margin-left: 4px; }
    .field input[type=text], .field input[type=password] { width: 100%; padding: 8px 10px; background: #0b0d12; border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-family: ui-monospace, Consolas, monospace; }
    .status { font-size: 13px; min-height: 18px; margin-top: 4px; }
    details.help { position: relative; }
    details.help summary { list-style: none; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; color: var(--accent); font-weight: 700; margin-top: 3px; }
    details.help summary::-webkit-details-marker { display: none; }
    details.help .pop { position: absolute; right: 0; z-index: 2; width: 380px; background: #0b0d12; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
    details.help ol { padding-left: 18px; margin: 8px 0; }
    .actions { display: flex; gap: 12px; align-items: center; margin-top: 20px; }
    button, .button { padding: 9px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--accent); color: #04121f; font-weight: 600; cursor: pointer; text-decoration: none; }
    button.secondary, .button.secondary { background: transparent; color: var(--text); }
    button[disabled] { opacity: .5; cursor: not-allowed; }
    pre.log { background: #0b0d12; border: 1px solid var(--border); border-radius: 8px; padding: 12px; max-height: 60vh; overflow: auto; font: 13px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
    .errors { border-color: var(--fail); }
    .errors li { color: var(--fail); }
    .toggle { color: var(--accent); background: none; border: none; padding: 0; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body hx-headers='{"X-Requested-With": "htmx"}'>
<header>
  <h1>medialab setup</h1>
  <nav>
    <span class="{{ 'current' if step == 'prereqs' else '' }}">1 Prerequisites</span> ·
    <span class="{{ 'current' if step == 'credentials' else '' }}">2 Credentials</span> ·
    <span class="{{ 'current' if step == 'run' else '' }}">3 Run</span> ·
    <span class="{{ 'current' if step == 'result' else '' }}">4 Result</span>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
